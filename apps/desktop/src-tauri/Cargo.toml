[package]
name = "avizor"
version = "0.3.2"
description = "Avizor — el pulso de internet, local-first"
authors = ["smouj <smouj@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-or-later"
repository = "https://github.com/smouj/avizor"
homepage = "https://github.com/smouj/avizor"
default-run = "avizor"

[lib]
name = "avizor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Compilación de producción. Sin este feature, `tauri` arranca en modo
# desarrollo y la ventana carga `build.devUrl` (http://localhost:5173) en vez de
# los assets embebidos: fuera de `tauri dev` eso es una página en blanco.
# `tauri build` lo activa solo; compilando a mano hay que pedirlo:
#
#   cargo build --release --features custom-protocol
#
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dependencies]
keyring = "3.6.3"
avizor-chrome-session = { path = "crates/avizor-chrome-session" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.11.5"
tauri-plugin-http = "2.6.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"
tokio = { version = "1", features = ["sync", "time"] }
