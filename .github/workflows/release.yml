name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Compilar y publicar (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            args: ''
          - os: windows-latest
            label: Windows
            args: ''
          - os: macos-latest
            label: macOS
            args: '--target universal-apple-darwin'
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias del sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: pnpm/action-setup@v6  # la versión sale de packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Comprobar antes de empaquetar
        run: |
          pnpm --filter @avizor/tokens build
          pnpm -r typecheck
          pnpm --filter @avizor/engine test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Avizor ${{ github.ref_name }}'
          releaseBody: |
            Descarga el instalador de tu sistema y ejecútalo. No hay cuenta ni
            configuración: la app arranca con datos de ejemplo y activas tus
            fuentes en **Fuentes**.

            Cada plataforma adjunta su `SHA256SUMS-<sistema>.txt`. Descárgalo
            junto al instalador, en la misma carpeta, y comprueba:

            ```bash
            sha256sum -c SHA256SUMS-Linux.txt        # Linux
            shasum -a 256 -c SHA256SUMS-macOS.txt    # macOS
            certutil -hashfile Avizor_*_x64-setup.exe SHA256   # Windows
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          fail-on-unmatched-files: true

      # El texto del release prometía sumas de comprobación que luego no se
      # adjuntaban. Se generan aquí, con Node (está en las tres plataformas),
      # y se suben al mismo borrador.
      - name: Sumas de comprobación
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # macOS compila con --target universal-apple-darwin, así que sus
          # artefactos no están en target/release/bundle. Se busca en todo
          # target y así vale para las tres plataformas.
          bundle=apps/desktop/src-tauri/target
          out="SHA256SUMS-${{ matrix.label }}.txt"
          : > "$out"
          count=0
          # Sin mapfile: el bash de macOS es 3.2. El bucle va en tubería y
          # escribe al archivo, así que el contador no importa fuera.
          find "$bundle" -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' \) -print0 2>/dev/null |
            while IFS= read -r -d '' file; do
              node -e '
                const crypto = require("crypto"), fs = require("fs"), path = require("path");
                const file = process.argv[1];
                const hash = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
                console.log(hash + "  " + path.basename(file));
              ' "$file" >> "$out"
            done
          count=$(wc -l < "$out")
          if [ "$count" -eq 0 ]; then
            echo "no hay instaladores que sumar" >&2
            exit 1
          fi
          cat "$out"
          gh release upload "${{ github.ref_name }}" "$out" --clobber
